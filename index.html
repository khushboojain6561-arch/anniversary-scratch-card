
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ffe1ed, #fff1f6, #fce4ff);
  color: #70465b;
}

.card {
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,0.92);
  border-radius: 28px;
  padding: 35px 24px;
  text-align: center;
  box-shadow: 0 15px 50px rgba(181,105,145,0.15);
  border: 1px solid #fff;
}

.heart {
  font-size: 38px;
  margin-bottom: 10px;
  animation: pulse 2s infinite;
}

h1 {
  font-family: 'Playfair Display', serif;
  color: #c65c8a;
  font-size: 30px;
  margin: 8px 0;
}

.subtitle {
  font-size: 14px;
  line-height: 1.8;
  margin: 18px 0;
}

.scratch-box {
  position: relative;
  width: 100%;
  height: 180px;
  border-radius: 18px;
  overflow: hidden;
  margin: 25px 0;
  background: #fff0f6;
  border: 1px solid #f5c6dc;
}

.hidden-message {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 20px;
  color: #c65c8a;
}

.hidden-message .big {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  line-height: 1.5;
}

.hidden-message .small {
  font-size: 13px;
  margin-top: 10px;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
  touch-action: none;
}

.hint {
  font-size: 13px;
  color: #986a80;
  margin-top: 12px;
}

.reveal-button {
  display: none;
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 30px;
  color: white;
  background: linear-gradient(135deg, #e887b0, #c65c8a);
  font-family: 'Poppins', sans-serif;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 5px 18px #e9b4ce;
  transition: transform .2s;
}

.reveal-button:hover {
  transform: scale(1.03);
}

.footer {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 16px;
  color: #b87596;
  margin-top: 25px;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
</style>
</head>

<body>

<div class="card">

  <div class="heart">💗</div>

  <h1>Happy Anniversary!</h1>

  <div class="subtitle">
    Mummy & Papa,<br>
    a little surprise is hiding here.<br>
    Scratch it to discover what's waiting for you...
  </div>

  <div class="scratch-box" id="scratchBox">

    <div class="hidden-message">
      <div class="big">You are so loved! ♡</div>
      <div class="small">Your surprise is ready...</div>
    </div>

    <canvas id="scratchCanvas"></canvas>

  </div>

  <div class="hint" id="hint">
    ✨ Rub the silver surface to reveal your surprise ✨
  </div>

  <button class="reveal-button" id="revealButton">
    OPEN YOUR SURPRISE 💗
  </button>

  <div class="footer">
    A little something, made with love ♡
  </div>

</div>

<script>
const canvas = document.getElementById("scratchCanvas");
const box = document.getElementById("scratchBox");
const ctx = canvas.getContext("2d");
const button = document.getElementById("revealButton");
const hint = document.getElementById("hint");

let scratching = false;
let revealed = false;

function setupCanvas() {
  const rect = box.getBoundingClientRect();

  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;

  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const width = rect.width;
  const height = rect.height;

  const gradient = ctx.createLinearGradient(0, 0, width, height);
  gradient.addColorStop(0, "#d8d8d8");
  gradient.addColorStop(0.3, "#f7f7f7");
  gradient.addColorStop(0.5, "#c4c4c4");
  gradient.addColorStop(0.7, "#eeeeee");
  gradient.addColorStop(1, "#bdbdbd");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#777777";
  ctx.font = "600 18px Poppins, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("SCRATCH HERE ♡", width / 2, height / 2 - 8);

  ctx.font = "13px Poppins, sans-serif";
  ctx.fillText("A surprise awaits you!", width / 2, height / 2 + 23);

  ctx.globalCompositeOperation = "destination-out";
}

setupCanvas();

function scratch(e) {
  if (!scratching || revealed) return;

  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  ctx.beginPath();
  ctx.arc(x, y, 22, 0, Math.PI * 2);
  ctx.fill();

  checkReveal();
}

canvas.addEventListener("pointerdown", (e) => {
  scratching = true;
  canvas.setPointerCapture(e.pointerId);
  scratch(e);
});

canvas.addEventListener("pointermove", scratch);

canvas.addEventListener("pointerup", () => {
  scratching = false;
});

canvas.addEventListener("pointercancel", () => {
  scratching = false;
});

function checkReveal() {
  if (revealed) return;

  const pixels = ctx.getImageData(
    0, 0, canvas.width, canvas.height
  ).data;

  let cleared = 0;
  let total = 0;

  for (let i = 3; i < pixels.length; i += 16) {
    total++;

    if (pixels[i] < 50) {
      cleared++;
    }
  }

  if (cleared / total > 0.35) {
    reveal();
  }
}

function reveal() {
  revealed = true;

  canvas.style.transition = "opacity 1s";
  canvas.style.opacity = "0";

  setTimeout(() => {
    canvas.style.display = "none";
  }, 1000);

  hint.textContent = "💗 Your surprise has been unlocked! 💗";

  button.style.display = "block";
}

button.addEventListener("click", () => {
  window.open(
    "https://khushboojain6561-arch.github.io/mummy-papa-anniversary/",
    "_blank"
  );
});
</script>

</body>
</html>
